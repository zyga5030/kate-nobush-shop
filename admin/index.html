<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop Admin (local only)</title>
<style>
  :root {
    --bg: #f4f4f3; --surface: #fff; --border: #ddddda; --text: #1a1a19;
    --soft: #6b6a66; --accent: #c2410c; --ok: #15803d; --danger: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    background: #1a1a19; color: #fff; padding: 14px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 1rem; letter-spacing: -.01em; }
  header .tag {
    background: var(--accent); font-size: .7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: .07em; padding: 3px 9px; border-radius: 999px;
  }
  header .spacer { margin-left: auto; }
  main { max-width: 1080px; margin: 0 auto; padding: 22px; }
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 18px; margin-bottom: 20px;
  }
  .panel h2 { margin: 0 0 14px; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--soft); }
  .fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
  label { display: block; font-size: .78rem; font-weight: 600; color: var(--soft); margin-bottom: 4px; }
  input[type=text], input[type=url], input[type=color], textarea, input[type=search] {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font: inherit; font-size: .9rem; background: #fff; color: var(--text);
  }
  textarea { resize: vertical; min-height: 58px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    border: 1px solid var(--border); background: #fff; color: var(--text);
    padding: 8px 14px; border-radius: 8px;
  }
  button:hover { border-color: var(--soft); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.ghost { background: transparent; border-color: transparent; color: var(--soft); padding: 4px 8px; }
  button.ghost:hover { color: var(--text); background: #0000000d; }
  button.danger { color: var(--danger); }
  .row {
    display: grid; grid-template-columns: 74px 1fr; gap: 14px;
    padding: 16px 0; border-top: 1px solid var(--border);
  }
  .row:first-of-type { border-top: 0; }
  .thumb {
    width: 74px; height: 74px; border-radius: 9px; overflow: hidden; background: var(--bg);
    border: 1px solid var(--border); display: grid; place-items: center;
    font-size: 1.6rem; font-weight: 700; color: #fff;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .row-main { display: grid; gap: 10px; min-width: 0; }
  .row-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .row-top .grow { flex: 1 1 220px; }
  .toggle {
    display: inline-flex; align-items: center; gap: 6px; font-size: .82rem;
    font-weight: 600; color: var(--soft); cursor: pointer; user-select: none;
    border: 1px solid var(--border); border-radius: 999px; padding: 5px 11px; background: #fff;
  }
  .toggle input { margin: 0; }
  .toggle.on { color: var(--accent); border-color: var(--accent); }
  .toggle.on.muted { color: var(--danger); border-color: var(--danger); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { font-size: .82rem; color: var(--soft); margin: 0; }
  .status { font-size: .82rem; color: var(--ok); font-weight: 600; }
  .warn {
    background: #fff7ed; border: 1px solid #fdba74; color: #7c2d12;
    padding: 12px 14px; border-radius: 10px; font-size: .85rem; margin-bottom: 20px;
  }
  code { background: #0000000d; padding: 1px 5px; border-radius: 4px; font-size: .85em; }
</style>
</head>
<body>

<header>
  <h1>Shop Admin</h1>
  <span class="tag">Local only</span>
  <div class="spacer"></div>
  <span class="status" id="status"></span>
</header>

<main>
  <div class="warn">
    This panel runs only on your machine and is never published. Edit here, click
    <strong>Download data.json</strong>, save the file over <code>src/data.json</code>,
    then run <code>node build.mjs</code> and commit.
  </div>

  <div class="panel">
    <h2>Data file</h2>
    <div class="bar">
      <button id="reload">Reload from src/data.json</button>
      <label class="toggle" style="cursor:pointer">
        Load file&hellip;<input type="file" id="file" accept="application/json,.json" hidden>
      </label>
      <button class="primary" id="download">Download data.json</button>
      <button id="copy">Copy JSON</button>
      <button class="danger" id="reset">Discard local draft</button>
    </div>
    <p class="note" style="margin-top:10px" id="source"></p>
  </div>

  <div class="panel">
    <h2>Site</h2>
    <div class="fields" id="site-fields"></div>
    <div style="margin-top:14px">
      <label>Footer note</label>
      <textarea id="site-footerNote"></textarea>
    </div>
    <div style="margin-top:14px">
      <h2 style="margin-bottom:10px">Social links</h2>
      <div id="links"></div>
      <button id="add-link" style="margin-top:10px">+ Add link</button>
    </div>
  </div>

  <div class="panel">
    <h2>Products <span id="count" style="color:var(--soft);font-weight:400"></span></h2>
    <div id="products"></div>
    <button class="primary" id="add" style="margin-top:16px">+ Add product</button>
  </div>
</main>

<script>
const DEFAULT_DATA = {
  site: { name: 'Shop', tagline: '', description: '', accent: '#c2410c', footerNote: '', links: [] },
  products: []
};

const DRAFT_KEY = 'shop-admin-draft';
let data = structuredClone(DEFAULT_DATA);

const $ = (id) => document.getElementById(id);
const statusEl = $('status');

let statusTimer;
function flash(message) {
  statusEl.textContent = message;
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.textContent = ''; }, 2200);
}

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (_) {}
}

function touch() {
  saveDraft();
  flash('Draft saved locally');
}

/* ---------- Site fields ---------- */

const SITE_FIELDS = [
  ['name', 'Shop name', 'text'],
  ['tagline', 'Tagline (big heading)', 'text'],
  ['description', 'Description', 'text'],
  ['accent', 'Accent color', 'color']
];

function renderSite() {
  const wrap = $('site-fields');
  wrap.innerHTML = '';
  for (const [key, label, type] of SITE_FIELDS) {
    const field = document.createElement('div');
    field.innerHTML = `<label>${label}</label>`;
    const input = document.createElement('input');
    input.type = type;
    input.value = data.site[key] ?? '';
    input.addEventListener('input', () => { data.site[key] = input.value; touch(); });
    field.append(input);
    wrap.append(field);
  }

  const footer = $('site-footerNote');
  footer.value = data.site.footerNote ?? '';
  footer.oninput = () => { data.site.footerNote = footer.value; touch(); };

  renderLinks();
}

function renderLinks() {
  const wrap = $('links');
  wrap.innerHTML = '';
  data.site.links = data.site.links ?? [];
  data.site.links.forEach((link, index) => {
    const row = document.createElement('div');
    row.className = 'row-top';
    row.style.marginBottom = '8px';

    const label = document.createElement('input');
    label.type = 'text';
    label.placeholder = 'Label';
    label.style.flex = '0 1 160px';
    label.value = link.label ?? '';
    label.addEventListener('input', () => { link.label = label.value; touch(); });

    const url = document.createElement('input');
    url.type = 'url';
    url.placeholder = 'https://…  (leave empty to hide)';
    url.className = 'grow';
    url.value = link.url ?? '';
    url.addEventListener('input', () => { link.url = url.value; touch(); });

    const remove = document.createElement('button');
    remove.className = 'ghost danger';
    remove.textContent = 'Remove';
    remove.onclick = () => { data.site.links.splice(index, 1); renderLinks(); touch(); };

    row.append(label, url, remove);
    wrap.append(row);
  });
}

/* ---------- Products ---------- */

function newId() {
  const used = new Set((data.products ?? []).map((p) => p.id));
  let n = (data.products?.length ?? 0) + 1;
  let id = `p${String(n).padStart(2, '0')}`;
  while (used.has(id)) id = `p${String(++n).padStart(2, '0')}`;
  return id;
}

function renderProducts() {
  const wrap = $('products');
  wrap.innerHTML = '';
  data.products = data.products ?? [];

  const visible = data.products.filter((p) => !p.hidden).length;
  const featured = data.products.filter((p) => p.pinned && !p.hidden).length;
  $('count').textContent = `— ${visible} published, ${featured} featured, ${data.products.length - visible} hidden`;

  data.products.forEach((product, index) => {
    const row = document.createElement('div');
    row.className = 'row';

    /* thumbnail */
    const thumb = document.createElement('div');
    thumb.className = 'thumb';
    const paintThumb = () => {
      thumb.innerHTML = '';
      if (product.image) {
        const img = document.createElement('img');
        img.src = product.image;
        img.alt = '';
        img.onerror = () => { product.image && (thumb.textContent = '!'); thumb.style.background = '#00000012'; };
        thumb.append(img);
      } else {
        thumb.textContent = (product.title || '?').trim()[0]?.toUpperCase() ?? '?';
        thumb.style.background = data.site.accent || '#c2410c';
      }
    };
    paintThumb();

    /* main column */
    const main = document.createElement('div');
    main.className = 'row-main';
    main.style.opacity = product.hidden ? '.5' : '1';

    const top = document.createElement('div');
    top.className = 'row-top';

    const title = document.createElement('input');
    title.type = 'text';
    title.placeholder = 'Product title';
    title.className = 'grow';
    title.value = product.title ?? '';
    title.addEventListener('input', () => { product.title = title.value; paintThumb(); touch(); });

    const price = document.createElement('input');
    price.type = 'text';
    price.placeholder = 'Price';
    price.style.flex = '0 0 100px';
    price.value = product.price ?? '';
    price.addEventListener('input', () => { product.price = price.value; touch(); });

    const badge = document.createElement('input');
    badge.type = 'text';
    badge.placeholder = 'Badge';
    badge.style.flex = '0 0 120px';
    badge.value = product.badge ?? '';
    badge.addEventListener('input', () => { product.badge = badge.value; touch(); });

    top.append(title, price, badge);

    const url = document.createElement('input');
    url.type = 'url';
    url.placeholder = 'Ad / affiliate link — https://…';
    url.value = product.url ?? '';
    url.addEventListener('input', () => { product.url = url.value; touch(); });

    const image = document.createElement('input');
    image.type = 'url';
    image.placeholder = 'Image URL — https://…  (empty = lettered tile)';
    image.value = product.image ?? '';
    image.addEventListener('input', () => { product.image = image.value; paintThumb(); touch(); });

    const description = document.createElement('textarea');
    description.placeholder = 'Description';
    description.value = product.description ?? '';
    description.addEventListener('input', () => { product.description = description.value; touch(); });

    /* toggles + actions */
    const actions = document.createElement('div');
    actions.className = 'actions';

    const makeToggle = (key, labelText, muted) => {
      const toggle = document.createElement('label');
      toggle.className = 'toggle' + (product[key] ? ' on' : '') + (muted ? ' muted' : '');
      const box = document.createElement('input');
      box.type = 'checkbox';
      box.checked = !!product[key];
      box.addEventListener('change', () => {
        product[key] = box.checked;
        touch();
        renderProducts();
      });
      toggle.append(box, document.createTextNode(labelText));
      return toggle;
    };

    const up = document.createElement('button');
    up.className = 'ghost';
    up.textContent = '↑';
    up.title = 'Move up';
    up.disabled = index === 0;
    up.onclick = () => {
      [data.products[index - 1], data.products[index]] = [data.products[index], data.products[index - 1]];
      renderProducts(); touch();
    };

    const down = document.createElement('button');
    down.className = 'ghost';
    down.textContent = '↓';
    down.title = 'Move down';
    down.disabled = index === data.products.length - 1;
    down.onclick = () => {
      [data.products[index + 1], data.products[index]] = [data.products[index], data.products[index + 1]];
      renderProducts(); touch();
    };

    const remove = document.createElement('button');
    remove.className = 'ghost danger';
    remove.textContent = 'Delete';
    remove.onclick = () => {
      if (!confirm(`Delete "${product.title || 'this item'}"?`)) return;
      data.products.splice(index, 1);
      renderProducts(); touch();
    };

    actions.append(
      makeToggle('pinned', 'Pinned'),
      makeToggle('hidden', 'Hidden', true),
      up, down, remove
    );

    main.append(top, url, image, description, actions);
    row.append(thumb, main);
    wrap.append(row);
  });
}

function renderAll() {
  renderSite();
  renderProducts();
}

/* ---------- Load / save ---------- */

function normalize(input) {
  const out = structuredClone(DEFAULT_DATA);
  out.site = { ...out.site, ...(input.site ?? {}) };
  out.site.links = Array.isArray(input.site?.links) ? input.site.links : [];
  out.products = (Array.isArray(input.products) ? input.products : []).map((p, i) => ({
    id: p.id ?? `p${String(i + 1).padStart(2, '0')}`,
    title: p.title ?? '',
    description: p.description ?? '',
    image: p.image ?? '',
    price: p.price ?? '',
    url: p.url ?? '',
    badge: p.badge ?? '',
    pinned: !!p.pinned,
    hidden: !!p.hidden
  }));
  return out;
}

async function loadFromDisk() {
  const response = await fetch('../src/data.json?t=' + Date.now());
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  return normalize(await response.json());
}

async function boot() {
  const draft = localStorage.getItem(DRAFT_KEY);
  if (draft) {
    try {
      data = normalize(JSON.parse(draft));
      $('source').textContent = 'Loaded your unsaved local draft. "Reload from src/data.json" discards it.';
      renderAll();
      return;
    } catch (_) {}
  }
  try {
    data = await loadFromDisk();
    $('source').textContent = 'Loaded from src/data.json.';
  } catch (_) {
    $('source').textContent =
      'Could not read src/data.json — open this page through a local server (npm run admin) or use "Load file…".';
  }
  renderAll();
}

$('reload').onclick = async () => {
  try {
    data = await loadFromDisk();
    localStorage.removeItem(DRAFT_KEY);
    $('source').textContent = 'Loaded from src/data.json.';
    renderAll();
    flash('Reloaded');
  } catch (_) {
    alert('Could not read ../src/data.json.\n\nRun the admin through a local server (npm run admin) or use "Load file…".');
  }
};

$('file').onchange = async (event) => {
  const file = event.target.files?.[0];
  if (!file) return;
  try {
    data = normalize(JSON.parse(await file.text()));
    $('source').textContent = `Loaded from ${file.name}.`;
    renderAll();
    touch();
  } catch (_) {
    alert('That file is not valid JSON.');
  }
  event.target.value = '';
};

const serialize = () => JSON.stringify(data, null, 2) + '\n';

$('download').onclick = () => {
  const blob = new Blob([serialize()], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = 'data.json';
  link.click();
  URL.revokeObjectURL(link.href);
  flash('Downloaded — save it over src/data.json');
};

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(serialize());
    flash('JSON copied');
  } catch (_) {
    alert('Clipboard blocked. Use "Download data.json" instead.');
  }
};

$('reset').onclick = () => {
  if (!confirm('Discard the local draft and reload from src/data.json?')) return;
  localStorage.removeItem(DRAFT_KEY);
  location.reload();
};

$('add').onclick = () => {
  data.products.push({
    id: newId(), title: 'New product', description: '', image: '',
    price: '', url: '', badge: '', pinned: false, hidden: false
  });
  renderProducts();
  touch();
};

$('add-link').onclick = () => {
  data.site.links.push({ label: '', url: '' });
  renderLinks();
  touch();
};

boot();
</script>

</body>
</html>
